<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Knowledge Assistant</title>
    <!-- Modern Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar / Header -->
        <header class="sidebar">
            <div class="branding">
                <h1>Knowledge<br><span>Assistant</span></h1>
                <p>Upload a document to start asking questions.</p>
            </div>
            
            <div class="upload-section">
                <div id="drop-zone" class="drop-zone">
                    <span class="drop-icon">📄</span>
                    <p>Drag & Drop your file here</p>
                    <span class="or-divider">- or -</span>
                    <label for="file-input" class="upload-btn">Browse Files</label>
                    <input type="file" id="file-input" accept=".pdf,.docx,.txt" hidden>
                </div>
                <div id="upload-status" class="status-indicator hidden">
                    <div class="spinner"></div>
                    <span id="status-text">Processing document...</span>
                </div>
            </div>
        </header>

        <!-- Main Chat Area -->
        <main class="chat-area">
            <div id="chat-messages" class="chat-messages">
                <div class="message assistant-msg welcome-msg">
                    <div class="msg-content">
                        Hello! I am ready to answer your questions based on the document you upload.
                    </div>
                </div>
            </div>
            
            <div class="chat-input-container">
                <input type="text" id="chat-input" placeholder="Ask a question about your document..." disabled>
                <button id="send-btn" disabled>
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='style.js') }}"></script>
</body>
</html>
